name: API Core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: api-core
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Verify npm script policy
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const lines = readFileSync(".npmrc", "utf8").split(/\r?\n/); if (!lines.some(line => line.trim() === "ignore-scripts=true")) { console.error(".npmrc must contain ignore-scripts=true"); process.exit(1); }'
          test "$(npm config get ignore-scripts)" = "true"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
